<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Eric Pastor OS icon</title>
  <desc id="desc">A glossy blue application tile with a white monitor and mint status sparkle.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#77d8ff"/>
      <stop offset="0.48" stop-color="#2588e8"/>
      <stop offset="1" stop-color="#1647ad"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123f9f"/>
      <stop offset="1" stop-color="#22c4e5"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff" stop-opacity=".72"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="15" stdDeviation="14" flood-color="#072b74" flood-opacity=".4"/>
    </filter>
  </defs>
  <rect x="26" y="26" width="460" height="460" rx="104" fill="url(#tile)" stroke="#0c398f" stroke-width="18"/>
  <path d="M51 130C68 67 117 47 180 47h152c64 0 104 18 129 81-91-34-310-34-410 2Z" fill="url(#gloss)"/>
  <g filter="url(#shadow)">
    <rect x="111" y="130" width="290" height="215" rx="40" fill="#fff"/>
    <rect x="141" y="160" width="230" height="145" rx="20" fill="url(#screen)" stroke="#aaf2ff" stroke-width="7"/>
    <path d="M236 343h40v48h-40z" fill="#fff"/>
    <rect x="178" y="381" width="156" height="31" rx="16" fill="#fff"/>
  </g>
  <circle cx="390" cy="119" r="30" fill="#64ff9c" stroke="#fff" stroke-width="9"/>
  <path d="M390 95v48M366 119h48" stroke="#087e66" stroke-width="8" stroke-linecap="round"/>
</svg>
